name: simple math CI pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    math-ci:
        runs-on: ubuntu-latest

        steps:
        - name: checkout repository
          uses: actions/checkout@v4

        - name: setup python
          uses: actions/setup-python@v4

          with:
            python-version: "3.10"

        - name: Install dependancies
          run:
            pip install -r requirements.txt

        - name: Run tests
          run: pytest -v


        
        